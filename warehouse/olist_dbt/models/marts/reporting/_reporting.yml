version: 2

models:
  - name: mart_seller_performance
    description: >
      Seller-level performance metrics for Business Question 1.
      Grain: one row per seller.

    columns:
      - name: seller_id
        description: "Unique identifier for the seller."
        data_tests:
          - not_null
          - unique

      - name: late_shipping_pct
        description: >
          Percentage of shipped order items handed to the carrier
          after the seller's shipping limit date.
          NULL means there were no qualifying shipped items
          for which this percentage could be calculated.

      - name: late_delivery_pct
        description: >
          Percentage of delivered orders involving the seller
          that were delivered late.
        data_tests:
          - not_null
  - name: mart_seller_perf
    columns:
      - name: seller_id
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_id

  - name: mart_delivery_delay_stages
    columns:
      - name: stage
        tests:
          - not_null
          - unique
          - accepted_values:
              arguments:
                values:
                  - approval
                  - seller_handling
                  - transit
      - name: pct_of_delay
        tests:
          - not_null
